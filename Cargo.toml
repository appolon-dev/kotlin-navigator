[package]
name = "kotlin-navigator"
version = "0.3.1"
edition = "2024"
rust-version = "1.90"
license = "MIT"
repository = "https://github.com/appolon-dev/kotlin-navigator"

[dependencies]
tree-sitter = "0.27"
tree-sitter-kotlin-ng = "1.1"
tree-sitter-java = "0.23"
lsp-server = "0.10"
lsp-types = "0.97"
ignore = "0.4"
rayon = "1.12"
serde_json = "1"
anyhow = "1"
log = "0.4"
url = "2.5"
libc = "0.2"
zip = { version = "3", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
